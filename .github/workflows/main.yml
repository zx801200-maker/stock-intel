name: Stock Intel 台美股盤前自動分析與推播

on:
  schedule:
    # 台股盤前：週一～週五 08:15 台北時間 = 00:15 UTC
    - cron: "15 0 * * 1-5"
    # 美股盤前：週一～週五 20:45 台北時間 = 12:45 UTC
    - cron: "45 12 * * 1-5"
  workflow_dispatch:
    inputs:
      session:
        description: "執行場次"
        required: true
        default: "tw_premarket"
        type: choice
        options:
          - tw_premarket
          - us_premarket
          - daily

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  analyze-and-push:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run analysis, push 3-card LINE Carousel, and prepare dashboard
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_FORMAT: flex
          WATCHLIST_SYMBOLS: ${{ vars.WATCHLIST_SYMBOLS }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ -z "$(find . -maxdepth 3 -name run.py)" ] && [ -f "stock-intel-github.zip" ]; then
            unzip -qo stock-intel-github.zip
          fi
          RUN_FILE="$(find . -maxdepth 3 -name run.py | head -n 1)"
          cd "$(dirname "$RUN_FILE")"
          pip install -r requirements.txt
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SESSION="${{ inputs.session }}"
          elif [ "${{ github.event.schedule }}" = "15 0 * * 1-5" ]; then
            SESSION="tw_premarket"
          else
            SESSION="us_premarket"
          fi
          python3 run.py push --session "${SESSION}"
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cp reports/latest_dashboard.html "$GITHUB_WORKSPACE/_site/index.html"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload dashboard artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: "_site"

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
